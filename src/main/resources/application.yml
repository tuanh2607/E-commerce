spring:
    application:
        name: ecommerce
    datasource:
        url: ${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true

server:
    port: 8080
    servlet:
        context-path: /e-commerce

logging:
    level:
       '[org.springframework.security]': DEBUG

account:
    admin:
        fullname: ${ADMIN_FULL_NAME}
        username: ${ADMIN_USER_NAME}
        password: ${ADMIN_PASS_WORD}
        email: ${ADMIN_EMAIL}
        phone: ${ADMIN_PHONE}

 